<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            border: 1px solid #334155;
        }

        h2 {
            text-align: center;
            margin-bottom: 16px;
            color: #38bdf8;
        }

        label {
            font-size: 13px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            margin-bottom: 12px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #3b82f6;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            background: #ef4444;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 13px;
            color: white;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Fog-Edge Login</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Log In</button>
    </form>

</div>

</body>
</html>
